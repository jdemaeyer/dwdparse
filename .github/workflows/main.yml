name: Continuous Integration

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra all
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Test
        run: uv run --frozen pytest
  type_check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group type_check
      - name: Type Check
        run: |
          uv run --frozen mypy --show-error-codes dwdparse --strict
          uv run --frozen mypy --show-error-codes tests --strict
  push-to-pypi:
    name: Push Python Package to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, type_check]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build Package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --user build
          python -m build
      - name: Push Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
