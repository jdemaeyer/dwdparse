[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dwdparse"
description = "Parsers for DWD's open weather data."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jakob de Maeyer", email = "jakob@naboa.de" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

[project.optional-dependencies]
lean = ["ijson"]
radar = ["h5py"]
all = ["h5py", "ijson"]

[project.scripts]
dwdparse = "dwdparse.cli:main"

[project.urls]
Source = "https://github.com/jdemaeyer/dwdparse/"
Tracker = "https://github.com/jdemaeyer/dwdparse/issues/"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["dwdparse"]

[tool.setuptools.dynamic]
version = { attr = "dwdparse.__version__" }

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]

[tool.ruff.lint.isort]
lines-after-imports = 2
